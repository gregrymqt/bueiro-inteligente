name: Android CI

on:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: 
      - master 
    paths:
      - 'app/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  testes-android:
    name: Testes Unitários Kotlin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # PASSO CORRIGIDO: Injeta a árvore completa com a api_key exigida pelo compilador do Google Services
      - name: Criar Mock do google-services.json para o compilador
        run: |
          echo '{"project_info":{"project_number":"123456789","project_id":"smart-drain-mock"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234:android:1234","android_client_info":{"package_name":"br.edu.fatecpg"}},"api_key":[{"current_key":"mock_key_for_ci_purposes_only"}],"services":{"appinvite_service":{"status":1}}}]}' > app/app/google-services.json

      - name: Dar permissão de execução ao Gradle
        run: chmod +x app/gradlew

      - name: Executar Testes Unitários
        run: |
          cd app
          ./gradlew testDebugUnitTest --no-daemon